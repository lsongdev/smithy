{{ template "header" . }}


{{ $repo := .RepoName }}
{{ $ref := .RefName }}

{{ template "nav" . }}

<h3>Blob</h3>

<dl>
  <dt>ref</dt>
  <dd><a href="/{{ $repo }}/log?ref={{ urlquery $ref }}">{{ .RefName }}</a></dd>

  <dt>path</dt>
  <dd><a href="/{{ $repo }}/tree?ref={{ urlquery $ref }}&path={{ urlquery .ParentPath }}">{{ .ParentPath }}</a>/<a href="">{{ .File.Name }}</a></dd>
</dl>

<hr>

<pre>
{{ if .TooLarge }}File is too large to display.{{ else }}
{{ .Contents }}
{{ end }}
</pre>

{{ template "footer" }}
